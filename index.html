<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" href="./style.css">
</head>
<body class="container-xl mx-auto">
<table class="table">
    <thead>
        <tr>
            <th scope="col">Name</th>
            <th scope="col">Price</th>
        </tr>
    </thead>
     <tbody id="tbody">

    </tbody>

</table>

<form id="form">
  <div class="form-group">
    <label for="movieName">Drink name:</label>
    <input type="text" class="form-control" id="drinkName">
    <div id="alertName" class="form-text text-danger" ></div>
  </div>

  <div class="form-group">
    <label for="movieYear">Price:</label>
    <input type="number" class="form-control" id="drinkPrice" min="0" value="0">
    <div id="alertNumber" class="form-text text-danger" ></div>
  </div>
  <button type="button" class="btn btn-primary " onclick="NewRow()">Submit</button>
</form>
    
</body>

<script src="main.js"> </script>
</html>
